{% extends 'base.html' %}
{% block content %}
<div class="col-md-4 mx-auto">
  <h2>Login</h2>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Login</button>
  </form>
  <p class="mt-3">No account? <a href="{% url 'accounts:register' %}">Register</a></p>
</div>
{% endblock %}
