{% extends 'base.html' %}
{% block title %}Account Created | Courtify{% endblock %}
{% block content %}
<div class="narrow" style="max-width:520px;margin-top:80px;text-align:center">
  <div class="card" style="padding:44px 36px">
    <div class="avatar" style="width:72px;height:72px;margin:0 auto 20px;background:#DCFCE7">
      <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
    </div>
    <h1 style="font-size:28px;font-weight:800;margin-bottom:8px">Account created successfully!</h1>
    <p class="muted" style="margin:0 0 28px;font-size:16px">Welcome to Courtify, <b>{{ username }}</b>. You can now log in.</p>
    <a href="{% url 'accounts:login' %}" class="btn blue" style="min-width:200px">Go to Login</a>
  </div>
</div>
{% endblock %}
