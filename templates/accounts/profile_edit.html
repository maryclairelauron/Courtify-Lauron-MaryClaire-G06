{% extends 'base.html' %}
{% block content %}
<div class="col-md-6">
  <h2>Edit Profile</h2>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-success">Save</button>
    <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
