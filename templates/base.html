<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Courtify{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="/">Courtify</a>
  <ul class="navbar-nav ms-auto align-items-center">
    {% if user.is_authenticated %}
      <li class="nav-item">
        <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}
          <button class="btn btn-outline-light btn-sm">Logout</button>
        </form>
      </li>
    {% else %}
      <li class="nav-item"><a class="nav-link" href="{% url 'accounts:login' %}">Login</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'accounts:register' %}">Register</a></li>
    {% endif %}
  </ul>
</nav>
<div class="container mt-4">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
